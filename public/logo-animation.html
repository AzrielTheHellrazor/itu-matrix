<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITU Matrix — Atomic Orbital Mark</title>
  <style>
    :root {
      --bg-canvas: #0B0B0E;
      --bg-surface: #111115;
      --bg-elevated: #17171C;
      --bg-hover: #1D1D24;
      --text-primary: #F4F4F5;
      --text-secondary: #A1A1AA;
      --text-muted: #8E929B;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-active: rgba(255, 255, 255, 0.22);
      --accent: #21D4FD;
      --accent-soft: rgba(33, 212, 253, 0.12);
      --accent-border: rgba(33, 212, 253, 0.42);
      --guide-color: rgba(255, 255, 255, 0.06);
      --logo-color: #FFFFFF;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-canvas: #F8F9FB;
      --bg-surface: #FFFFFF;
      --bg-elevated: #F1F3F6;
      --bg-hover: #E8EBF0;
      --text-primary: #111115;
      --text-secondary: #52525B;
      --text-muted: #6E737D;
      --border-subtle: rgba(17, 17, 21, 0.10);
      --border-active: rgba(17, 17, 21, 0.24);
      --accent: #0284C7;
      --accent-soft: rgba(2, 132, 199, 0.10);
      --accent-border: rgba(2, 132, 199, 0.38);
      --guide-color: rgba(17, 17, 21, 0.07);
      --logo-color: #111115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    }

    .mono {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .shell {
      min-height: 100vh;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    /* Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--logo-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Buttons */
    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 120ms ease;
    }

    button:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-active);
    }

    button:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-theme {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 13px;
      background: var(--bg-surface);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* Main Stage */
    .stage-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 28px 24px 22px;
      position: relative;
      overflow: hidden;
    }

    .stage-visual {
      position: relative;
      width: min(64vw, 290px);
      height: min(64vw, 290px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--logo-color);
    }

    .stage-guides {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 50%;
      border: 1px dashed var(--guide-color);
    }

    .stage-guides::before,
    .stage-guides::after {
      content: "";
      position: absolute;
      background: var(--guide-color);
    }

    .stage-guides::before {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .stage-guides::after {
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
    }

    #matrix-atom-logo {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* Scale preview row + telemetry */
    .stage-meta {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .telemetry {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .status-pill[data-state="paused"] .status-dot {
      background: var(--text-muted);
    }

    .scale-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--logo-color);
    }

    .scale-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Controls Dock */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 15px;
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .btn-primary:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-secondary {
      min-height: 36px;
      padding: 0 12px;
      background: var(--bg-elevated);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .speed-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .speed-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
    }

    .speed-presets {
      display: inline-flex;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      gap: 2px;
    }

    .speed-btn {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .speed-btn.is-active {
      background: var(--bg-surface);
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    .speed-slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      width: 110px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-readout {
      min-width: 46px;
      text-align: right;
      font-size: 12px;
      color: var(--text-primary);
    }

    @media (max-width: 640px) {
      .shell {
        padding: 16px 14px 20px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .speed-group {
        justify-content: space-between;
      }
    }
  </style>
</head>

      const themeToggleBtn = document.getElementById("theme-toggle-btn");
      const themeIcon = document.getElementById("theme-icon");
      const themeLabel = document.getElementById("theme-label");

      const reducedMotionQuery =
        typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : null;

      let isPlaying = !(reducedMotionQuery && reducedMotionQuery.matches);
      let speed = 0.7;
      let phases = ORBIT_PARAMS.map((o) => o.init);
      let elapsed = 0;
      let lastTimestamp = null;
      let rafId = 0;

      function renderFrame() {
        for (let i = 0; i < ORBIT_PARAMS.length; i++) {
          const p = ORBIT_PARAMS[i];
          const rad = (phases[i] * Math.PI) / 180;
          const x = p.cx + p.rx * Math.cos(rad);
          const y = p.cy + p.ry * Math.sin(rad);
          electrons[i].setAttribute(
            "transform",
            `translate(${x.toFixed(2)} ${y.toFixed(2)})`
          );
        }
        const pulseScale = 1 + 0.055 * Math.sin(elapsed * ((2 * Math.PI) / 3.6));
        core.setAttribute(
          "transform",
          `translate(128 128) scale(${pulseScale.toFixed(4)})`
        );
        angleReadout.textContent = phases
          .map((deg, idx) => `e${idx + 1} ${deg.toFixed(0)}°`)
          .join(" · ");
      }

      function syncTransportUI() {
        playPauseBtn.setAttribute("aria-pressed", String(isPlaying));
        playPauseIcon.textContent = isPlaying ? "❚❚" : "▶";
        playPauseLabel.textContent = isPlaying ? "Pause" : "Play";
        statusPill.setAttribute("data-state", isPlaying ? "running" : "paused");
        if (isPlaying) {
          statusText.textContent = "Running";
        } else if (reducedMotionQuery && reducedMotionQuery.matches && elapsed === 0) {
          statusText.textContent = "Reduced Motion";
        } else {
          statusText.textContent = "Paused";
        }
      }

      function setSpeed(nextSpeed) {
        speed = Math.min(4, Math.max(0.1, Number(nextSpeed) || 0.7));
        speedSlider.value = String(speed);
        speedValue.textContent = `${speed.toFixed(2)}×`;
        for (const btn of speedBtns) {
          const preset = Number(btn.getAttribute("data-speed"));
          btn.classList.toggle("is-active", Math.abs(preset - speed) < 0.001);
        }
      }

      function tick(timestamp) {
        if (!isPlaying) {
          lastTimestamp = null;
          rafId = 0;
          return;
        }
        if (lastTimestamp === null) {
          lastTimestamp = timestamp;
        }
        const dtSec = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
        lastTimestamp = timestamp;
        elapsed += dtSec * speed;

        for (let i = 0; i < phases.length; i++) {
          phases[i] = (phases[i] + ORBIT_PARAMS[i].speed * speed * dtSec + 360) % 360;
        }
        renderFrame();
        rafId = window.requestAnimationFrame(tick);
      }

      function startLoop() {
        if (rafId) window.cancelAnimationFrame(rafId);
        lastTimestamp = null;
        if (isPlaying) {
          rafId = window.requestAnimationFrame(tick);
        }
      }

      playPauseBtn.addEventListener("click", () => {
        isPlaying = !isPlaying;
        syncTransportUI();
        startLoop();
      });

      resetBtn.addEventListener("click", () => {
        phases = ORBIT_PARAMS.map((o) => o.init);
        elapsed = 0;
        lastTimestamp = null;
        renderFrame();
        syncTransportUI();
      });

      speedSlider.addEventListener("input", (event) => {
        setSpeed(event.target.value);
      });

      for (const btn of speedBtns) {
        btn.addEventListener("click", () => {
          setSpeed(btn.getAttribute("data-speed"));
        });
      }

      function syncThemeUI(theme) {
        const isLight = theme === "light";
        document.documentElement.setAttribute("data-theme", theme);
        themeToggleBtn.setAttribute("aria-pressed", String(isLight));
        themeIcon.textContent = isLight ? "☾" : "☀";
        themeLabel.textContent = isLight ? "Dark Mode" : "Light Mode";
      }

      themeToggleBtn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        syncThemeUI(current === "light" ? "dark" : "light");
      });

      if (reducedMotionQuery) {
        reducedMotionQuery.addEventListener("change", (event) => {
          if (event.matches) {
            isPlaying = false;
            syncTransportUI();
            startLoop();
          }
        });
      }

      setSpeed(0.7);
      renderFrame();
      syncTransportUI();
      startLoop();
    })();
  </script>
</body>
</html>
